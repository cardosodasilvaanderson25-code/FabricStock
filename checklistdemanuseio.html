<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Manuseio</title>
    <link rel="stylesheet" href="csscklistdemanuseio/styles.css">
</head>
<body>

    <header class="topo-site">
    <div class="container-header">
        <img src="Fotologotipo/LogoFabrickStock.png" alt="Logo FabrickStock" class="logo-principal">
        
        <div class="titulo-com-icone">
            <img src="fotoschecklistmanuseio/prancheta.png" alt="Ícone" class="mini-icone-prancheta">
            <h1>Checklist de Manuseio</h1>
        </div>
    </div>
</header>

<main class="container-grid">
    <div class="item-checklist">
        <div class="quadrado-verde">
            <img src="fotoschecklistmanuseio/calcados.png" alt="Sapatos">
        </div>
        <button class="botao-branco">Calçados</button>
    </div>

    <div class="item-checklist">
        <div class="quadrado-verde">
            <img src="fotoschecklistmanuseio/meia.png" alt="Meias">
        </div>
        <button class="botao-branco">Meias</button>
    </div>

    <div class="item-checklist">
        <div class="quadrado-verde">
            <img src="fotoschecklistmanuseio/camisa.png" alt="Camisas">
        </div>
        <button class="botao-branco">Camisas</button>
    </div>

    <div class="item-checklist">
        <div class="quadrado-verde">
            <img src="fotoschecklistmanuseio/calca.png" alt="Calças">
        </div>
        <button class="botao-branco">Calças</button>
    </div>
</main>

</body>
</html>
